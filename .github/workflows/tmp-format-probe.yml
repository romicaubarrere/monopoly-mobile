name: Temporary format probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Print canonical Dart formatter delta
        run: |
          dart format apps/mobile/lib/design_system/status_badges.dart apps/mobile/test/status_badges_test.dart
          git diff -- apps/mobile/lib/design_system/status_badges.dart apps/mobile/test/status_badges_test.dart
