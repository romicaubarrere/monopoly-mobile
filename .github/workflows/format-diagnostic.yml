name: Format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Print Dart 3.13 formatted responsive matrix
        run: |
          dart format apps/mobile/test/responsive_accessibility_matrix_test.dart
          cat apps/mobile/test/responsive_accessibility_matrix_test.dart
