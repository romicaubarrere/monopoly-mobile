name: Diagnose Cucha Format

on:
  pull_request:
    paths:
      - 'apps/mobile/lib/ui/cucha/cucha_surface.dart'
      - 'apps/mobile/test/cucha_surface_test.dart'
      - '.github/workflows/diagnose-cucha-format.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Print canonical Dart formatter diff
        shell: bash
        run: |
          dart format apps/mobile/lib/ui/cucha/cucha_surface.dart apps/mobile/test/cucha_surface_test.dart
          git diff -- apps/mobile/lib/ui/cucha/cucha_surface.dart apps/mobile/test/cucha_surface_test.dart
