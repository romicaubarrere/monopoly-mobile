name: Temporary Money Format Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Show canonical Dart 3.13 formatting
        run: dart format --output=show apps/mobile/lib/design_system/money_text.dart apps/mobile/test/money_text_test.dart
