name: UX Free Parking format probe

on:
  push:
    branches:
      - feat/ui-free-parking-almacen
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Print canonical formatter diff
        run: |
          dart format \
            apps/mobile/lib/ui/events/free_parking_event_surface.dart \
            apps/mobile/test/free_parking_event_surface_test.dart
          git diff -- \
            apps/mobile/lib/ui/events/free_parking_event_surface.dart \
            apps/mobile/test/free_parking_event_surface_test.dart
