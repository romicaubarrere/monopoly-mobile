name: Card Format Diagnostic

on:
  pull_request:
    paths:
      - 'apps/mobile/lib/ui/cards/**'
      - 'apps/mobile/test/card_reveal_surface_test.dart'
      - '.github/workflows/card-format-diagnostic.yml'

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Show canonical formatter diff
        shell: bash
        run: |
          set -euo pipefail
          dart format apps/mobile/lib/ui/cards/card_reveal_surface.dart apps/mobile/test/card_reveal_surface_test.dart
          git diff -- apps/mobile/lib/ui/cards/card_reveal_surface.dart apps/mobile/test/card_reveal_surface_test.dart
