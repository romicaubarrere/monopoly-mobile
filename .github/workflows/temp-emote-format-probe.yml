name: Temporary emote format probe

on:
  push:
    branches:
      - feat/ui-emotes-almacen

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Print canonical Dart formatting
        shell: bash
        run: |
          dart format apps/mobile/lib/ui/emotes/emote_surface.dart apps/mobile/test/emote_surface_test.dart
          echo '===EMOTE_SURFACE_BEGIN==='
          cat apps/mobile/lib/ui/emotes/emote_surface.dart
          echo '===EMOTE_SURFACE_END==='
          echo '===EMOTE_TEST_BEGIN==='
          cat apps/mobile/test/emote_surface_test.dart
          echo '===EMOTE_TEST_END==='
