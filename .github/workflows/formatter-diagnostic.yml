name: Formatter Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  formatter-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Print Dart 3.13 formatter diff
        run: |
          dart format packages/backend_api/lib/src/deadline_authority.dart packages/backend_api/test/authority_lifecycle_test.dart
          git diff -- packages/backend_api/lib/src/deadline_authority.dart packages/backend_api/test/authority_lifecycle_test.dart
