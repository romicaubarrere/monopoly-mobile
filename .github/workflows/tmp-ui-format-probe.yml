name: Temporary UI Formatter Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  ui-format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Print exact Dart formatter diff
        run: |
          dart format \
            apps/mobile/lib/design_system/visual_components.dart \
            apps/mobile/lib/ui/home_screen.dart
          git diff -- \
            apps/mobile/lib/design_system/visual_components.dart \
            apps/mobile/lib/ui/home_screen.dart
