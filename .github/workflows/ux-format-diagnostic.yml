name: UX format diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dart-format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Show formatter diff
        run: |
          dart format apps/mobile/lib/ui/bankruptcy/bankruptcy_surface.dart apps/mobile/test/bankruptcy_surface_test.dart
          git diff -- apps/mobile/lib/ui/bankruptcy/bankruptcy_surface.dart apps/mobile/test/bankruptcy_surface_test.dart
