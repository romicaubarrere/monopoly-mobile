name: Format Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Print exact Dart formatter diff
        run: |
          dart format apps/mobile/lib/ui/room_entry/create_room_screen.dart apps/mobile/lib/ui/room_entry/join_room_screen.dart apps/mobile/lib/ui/room_entry/lobby_screen.dart apps/mobile/lib/ui/room_entry/room_entry_components.dart apps/mobile/test/room_entry_surfaces_test.dart
          git diff -- apps/mobile/lib/ui/room_entry/create_room_screen.dart apps/mobile/lib/ui/room_entry/join_room_screen.dart apps/mobile/lib/ui/room_entry/lobby_screen.dart apps/mobile/lib/ui/room_entry/room_entry_components.dart apps/mobile/test/room_entry_surfaces_test.dart
