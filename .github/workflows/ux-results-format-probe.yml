name: UX Results formatter probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Print canonical formatted files
        run: |
          dart format apps/mobile/lib/ui/results/results_surface.dart apps/mobile/test/results_surface_test.dart
          echo 'RESULTS_SURFACE_B64_BEGIN'
          base64 -w0 apps/mobile/lib/ui/results/results_surface.dart
          echo
          echo 'RESULTS_SURFACE_B64_END'
          echo 'RESULTS_TEST_B64_BEGIN'
          base64 -w0 apps/mobile/test/results_surface_test.dart
          echo
          echo 'RESULTS_TEST_B64_END'
          exit 1
