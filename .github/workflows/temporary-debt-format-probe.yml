name: Temporary Debt formatter probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Print exact formatted Dart sources
        run: |
          dart format apps/mobile/lib/ui/debt/debt_resolution_surface.dart apps/mobile/test/debt_resolution_surface_test.dart
          echo '===== SOURCE_BEGIN ====='
          cat apps/mobile/lib/ui/debt/debt_resolution_surface.dart
          echo '===== SOURCE_END ====='
          echo '===== TEST_BEGIN ====='
          cat apps/mobile/test/debt_resolution_surface_test.dart
          echo '===== TEST_END ====='
          exit 1
