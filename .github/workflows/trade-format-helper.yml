name: Trade format helper

on:
  push:
    branches:
      - feat/ui-trade-surfaces

permissions:
  contents: write

jobs:
  format-and-fix-handoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/ui-trade-surfaces
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Apply canonical formatting and handoff correction
        shell: bash
        run: |
          dart format apps/mobile/lib/ui/trade/trade_surfaces.dart apps/mobile/test/trade_surfaces_test.dart
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/ux-trade-handoff.md')
          text = path.read_text()
          old = "**Decision:** `waitingHuman` disables Accept/Counter/Reject and communicates `Esperando a que vuelva el jugador`. The UI never portrays the temporary bot as consenting."
          new = "**Decision:** `waitingHuman` disables Accept/Counter/Reject; Accept exposes `El bot temporal no puede aceptar` and the secondary-action semantics explain `Esperando al jugador`. The UI never portrays the temporary bot as consenting."
          if old not in text:
              raise SystemExit('expected handoff sentence not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatter changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/lib/ui/trade/trade_surfaces.dart apps/mobile/test/trade_surfaces_test.dart docs/ux-trade-handoff.md
          git commit -m 'style: apply canonical trade formatting'
          git push origin HEAD:feat/ui-trade-surfaces
