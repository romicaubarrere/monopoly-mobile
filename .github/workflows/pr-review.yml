name: PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-review:
    name: review / static-analysis
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Narrow exception: reviewdog needs this only to publish inline PR review comments.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
          # v2.23 nests the SDK in flutter/; do not restore immutable v2.21 caches.
          cache-key: 'flutter-sdk-layout-v2-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.0

      - name: Review Dart domain and backend changes
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dart analyze \
            packages/game_core \
            packages/game_contracts \
            packages/backend_api \
            backend/command_service \
            --format=machine 2>&1 | \
          reviewdog \
            -efm='%t%*[^|]|%*[^|]|%*[^|]|%f|%l|%c|%*[^|]|%m' \
            -name='dart-analyze' \
            -reporter=github-pr-review \
            -filter-mode=added \
            -fail-level=error

      - name: Review Flutter app changes
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flutter analyze apps/mobile --machine 2>&1 | \
          reviewdog \
            -efm='%t%*[^|]|%*[^|]|%*[^|]|%f|%l|%c|%*[^|]|%m' \
            -name='flutter-analyze' \
            -reporter=github-pr-review \
            -filter-mode=added \
            -fail-level=error

      - name: Check formatting
        run: python3 -B tool/preflight.py --format-only

  workflow-review:
    name: review / github-actions
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          version='1.7.12'
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" \
            --output "${archive}"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz' | sha256sum --check
          tar -xzf "${archive}" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Lint GitHub Actions workflows
        run: actionlint

  secret-review:
    name: security / changed-secrets
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install detect-secrets
        shell: bash
        run: |
          set -euo pipefail
          # Python -I deliberately ignores user-site installs. Keep the pinned
          # detector visible there without weakening isolated baseline checks.
          secret_venv="$(mktemp -d "${RUNNER_TEMP}/detect-secrets.XXXXXX")"
          python -m venv "${secret_venv}"
          "${secret_venv}/bin/python" -m pip install --disable-pip-version-check 'detect-secrets==1.5.0'
          "${secret_venv}/bin/python" -I -B -c 'import detect_secrets'
          printf '%s\n' "${secret_venv}/bin" >> "${GITHUB_PATH}"

      - name: Validate the audited public-fixture baseline
        run: python -B tool/secret_baseline_guard.py

      - name: Test baseline policy and real secret detection
        run: |
          python -B -m unittest discover -s tool/test -p 'secret_baseline_guard_test.py' -v
          python -B -m unittest discover -s tool/security_test -p '*_test.py' -v

      - name: Scan added and modified files for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git diff --diff-filter=ACM --name-only -z "${BASE_SHA}...${HEAD_SHA}")
          if (( ${#files[@]} == 0 )); then
            echo 'No added or modified files to scan.'
            exit 0
          fi
          detect-secrets-hook --baseline .secrets.baseline -- "${files[@]}"

  dependency-review:
    name: security / dependency-vulnerabilities
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Scan Dart and npm lockfiles with OSV
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/src" \
            -w /src \
            ghcr.io/google/osv-scanner:v2.5.1 \
            scan --recursive .
