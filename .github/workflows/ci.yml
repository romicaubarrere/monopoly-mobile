name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Temporary UX formatter probe
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/lib/ui/home_screen.dart')
          text = path.read_text()
          text = text.replace('        const Semantics(\n          label: \'Estado de conexión: prototipo local\',', '        Semantics(\n          label: \'Estado de conexión: prototipo local\',', 1)
          path.write_text(text)
          PY
          dart format apps/mobile/lib/design_system/app_theme.dart apps/mobile/lib/ui/home_screen.dart apps/mobile/test/app_smoke_test.dart apps/mobile/test/design_system_shell_test.dart
          for file in apps/mobile/lib/design_system/app_theme.dart apps/mobile/lib/ui/home_screen.dart apps/mobile/test/app_smoke_test.dart apps/mobile/test/design_system_shell_test.dart; do
            echo "BEGIN_BASE64:$file"
            base64 -w0 "$file"
            echo
            echo "END_BASE64:$file"
          done
      - name: Foundation gates
        run: ./tool/ci.sh

  firebase-emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - name: Runtime versions
        run: |
          node --version
          npm --version
          java -version
      - name: Install pinned emulator test dependencies
        working-directory: tool/firebase
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Auth + Firestore emulator security tests
        working-directory: tool/firebase
        run: npm run emulators:test
