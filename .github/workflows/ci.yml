name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Temporary read-only receipt formatter probe
        run: |
          dart format apps/mobile/lib/ui/feedback/economy_receipt.dart
          echo BEGIN_RECEIPT_BASE64
          base64 -w0 apps/mobile/lib/ui/feedback/economy_receipt.dart
          echo
          echo END_RECEIPT_BASE64
      - name: Foundation gates
        run: ./tool/ci.sh

  firebase-emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - name: Runtime versions
        run: |
          node --version
          npm --version
          java -version
      - name: Install pinned emulator test dependencies
        working-directory: tool/firebase
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Auth + Firestore emulator security tests
        working-directory: tool/firebase
        run: npm run emulators:test
