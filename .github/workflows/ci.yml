name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Foundation gates
        run: ./tool/ci.sh

  firebase-emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Runtime versions
        run: |
          node --version
          npm --version
          java -version
      - name: Install pinned emulator test dependencies
        working-directory: tool/firebase
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Auth + Firestore emulator security tests
        working-directory: tool/firebase
        run: npm run emulators:test
