name: UX format probe

on:
  pull_request:
    paths:
      - 'apps/mobile/lib/ui/resume/classic_resume_card.dart'
      - '.github/workflows/ux-format-probe.yml'

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Show Dart formatter diff
        run: |
          dart format apps/mobile/lib/ui/resume/classic_resume_card.dart
          git diff -- apps/mobile/lib/ui/resume/classic_resume_card.dart
